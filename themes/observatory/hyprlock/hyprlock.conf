# aster — Observatory (hyprlock)
# near-black, brass, huge mono clock bottom-left, LOCKED tab top-right

$ground = rgba(10, 10, 11, 1.0)
$surface = rgba(17, 17, 19, 1.0)
$ring = rgba(28, 26, 22, 1.0)
$text = rgba(233, 226, 211, 1.0)
$muted = rgba(154, 145, 127, 1.0)
$brass = rgba(212, 162, 76, 1.0)
$alert = rgba(200, 115, 90, 1.0)
$font = IBM Plex Mono

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = $ground
}

# Orbit rings rising from below the screen
shape {
    monitor =
    size = 1700, 1700
    color = rgba(0, 0, 0, 0.0)
    rounding = -1
    border_size = 1
    border_color = $ring
    position = 0, -1250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 1300, 1300
    color = rgba(0, 0, 0, 0.0)
    rounding = -1
    border_size = 1
    border_color = $ring
    position = 0, -1050
    halign = center
    valign = center
}

# LOCKED tab
shape {
    monitor =
    size = 120, 30
    color = $brass
    rounding = 0
    position = -72, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = LOCKED
    color = $surface
    font_size = 11
    font_family = $font Bold
    position = -95, -7
    halign = right
    valign = top
}

# Date line
label {
    monitor =
    text = cmd[update:60000] m=$(date +%-m); r=$(echo I II III IV V VI VII VIII IX X XI XII | cut -d' ' -f$m); echo "$(date +%a | tr a-z A-Z) · $(date +%d) · $r · $(date +%Y) · ASTER"
    color = $muted
    font_size = 14
    font_family = $font
    # The clock below is 312px tall from y=120 and its digits reach y≈356;
    # the theme's original 330 put this line behind them.
    position = 72, 390
    halign = left
    valign = bottom
}

# Clock, seconds in brass
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)<span size='36pt' foreground='##d4a24c'>:$(date +%S)</span>"
    color = $text
    font_size = 180
    font_family = $font Light
    position = 64, 120
    halign = left
    valign = bottom
}

# Password line
input-field {
    monitor =
    size = 420, 44
    outline_thickness = 1
    rounding = 0
    outer_color = $brass
    inner_color = $surface
    font_color = $text
    font_family = $font
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = false
    fade_on_empty = false
    placeholder_text = <span foreground="##d4a24c">›</span>
    check_color = $brass
    fail_color = $alert
    fail_text = <span foreground="##c8735a">› DENIED ($ATTEMPTS)</span>
    capslock_color = $alert
    position = 72, 72
    halign = left
    valign = bottom
}
